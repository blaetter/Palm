$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Checkbox
status: experimental
group: Atoms
description: >
  Checkbox. The input template of the theme renders Drupal checkboxes with it and passes their
  attributes; the label comes from Drupal's form element. Its CSS also styles palm:radio.
libraryOverrides:
  dependencies:
    - palm/tokens
props:
  type: object
  properties: {}
slots:
  children:
    title: Children
    description: Markup after the field, e.g. from Drupal form element children.
