# palm.libraries.yml
global-styling:
  version: 1.x
  css:
    base:
      # Declares the cascade layer order, must come first.
      css/layers.css: { weight: -100 }
      # CSS of core, Classy and modules in the layer legacy, before palm.css (see palm.info.yml).
      css/drupal-layer.css: { weight: -50 }
    theme:
      # Built by the blaetter-theme styleguide, in the layer legacy.
      bundle/palm.css: {}
global-scripts:
  version: 1.x
  js:
    bundle/palm.js: {attributes: {id: 'echo-behavior-js'}}
# Design tokens (CSS custom properties) used by the components in components/.
# blaetter-tokens.css (copy of blaetter-design) must come before tokens.css.
tokens:
  version: 1.x
  css:
    base:
      css/blaetter-tokens.css: {}
      css/tokens.css: {}
# Search with Search API and facets, attached on /suche.
blaetter-search:
  version: 1.x
  css:
    component:
      css/blaetter-search.css: {}
  js:
    js/blaetter-search.js: {}
  dependencies:
    - core/drupal
    - core/once
    - palm/tokens
# Drupal's status messages in the colours of blaetter-design (instead of Classy's).
messages:
  version: 1.x
  css:
    component:
      css/messages.css: {}
  dependencies:
    - palm/tokens
# ALTCHA widget and the CAPTCHA box of administrators. Global, because the
# CAPTCHA module attaches no library in its administration mode.
captcha:
  version: 1.x
  css:
    component:
      css/captcha.css: {}
  dependencies:
    - palm/tokens
# Contextual links of editors: triggers outside of the blocks (css/contextual.css).
contextual:
  version: 1.x
  css:
    theme:
      css/contextual.css: {}
  dependencies:
    - palm/tokens
# Promo banner: colours of the theme settings, closing it (kept for logged in users that day). In the head, so a
# closed banner does not flash (js/promo.js).
promo:
  version: 1.x
  header: true
  css:
    component:
      css/promo.css: {}
  js:
    js/promo.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - palm/tokens
# Colour fields of the promo banner in the theme settings (admin theme): swatches, live preview and contrast.
promo-settings:
  version: 1.x
  css:
    theme:
      css/promo-settings.css: {}
  js:
    js/promo-settings.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - palm/tokens
