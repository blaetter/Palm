name: Palm
type: theme
description: 'The theme for www.blaetter.de'
core_version_requirement: ^10 || ^11
libraries:
  - palm/global-styling
  - palm/global-scripts
base theme: classy
# The CSS of these libraries is loaded from css/drupal-layer.css instead, in the
# cascade layer drupal (scripts/build-drupal-layer.mjs). Unlayered CSS would win
# over the layered theme CSS.
libraries-override:
  core/normalize: false
  classy/base: false
  classy/messages: false
  eu_cookie_compliance/eu_cookie_compliance_bare:
    css:
      state:
        css/eu_cookie_compliance.bare.css: false
  captcha/base:
    css:
      theme:
        css/captcha.css: false
logo: images/logo_tongue.svg
version: 1.0.0
regions:
  header: Header
  navigation: Navigation
  search: Search
  flyout: Flyout
  messages: Messages
  hero: Hero
  sidebar_left: 'Sidebar left'
  content: Content
  sidebar_right: 'Sidebar right'
  footer: Footer
  dumo: Dump
